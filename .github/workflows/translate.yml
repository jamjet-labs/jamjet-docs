name: Translate

# Manual only. This ran on every push to content/docs/en/** and failed 13
# runs in a row (May to October 2026) with "You've run out of credits" from
# Lingo.dev, leaving a red X on main after each docs merge. Run it by hand
# from the Actions tab once the credits are topped up. To go back to
# translating on every push, restore this trigger:
#
#   push:
#     branches: [main]
#     paths:
#       - 'content/docs/en/**'
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lingo.dev
        uses: lingodotdev/lingo.dev@main
        with:
          api-key: ${{ secrets.LINGODOTDEV_API_KEY }}
